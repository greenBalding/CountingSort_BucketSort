name: Publicar apresentação

on:
  push:
    branches: [main]
    paths:
      - 'web-apresentacao/**'
      - 'db-resultados/comparacao_medicoes.csv'
      - 'db-resultados/comparacao_resultados.xlsx'
      - 'doc-entrega/**'
      - 'cod-implementacao/preparar-apresentacao.mjs'
      - 'cod-implementacao/bucket_sort_int.c'
      - 'cod-implementacao/counting_sort.c'
      - 'cod-implementacao/benchmark_comparacao.c'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obter arquivos
        uses: actions/checkout@v6
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Atualizar dados da apresentação
        run: node cod-implementacao/preparar-apresentacao.mjs
      - name: Preparar apresentação
        uses: actions/upload-pages-artifact@v4
        with:
          path: web-apresentacao
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
